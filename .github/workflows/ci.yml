name: "Firewalk CI"

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  macOS:
    name: macOS
    runs-on: self-xcode264
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: SPM Test
        run: set -o pipefail && swift test --sanitize=thread -c debug 2>&1
  Linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.3-jammy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: SPM Linux Test
        run: swift test -c debug
  Linux_Nightly:
    name: Linux Nightly
    runs-on: ubuntu-latest
    container:
      image: swiftlang/swift:nightly-jammy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: SPM Linux Test
        run: swift test -c debug
